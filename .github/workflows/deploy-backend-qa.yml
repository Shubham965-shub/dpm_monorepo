name: Deploy backend (QA)

on:
  push:
    branches: [qa]
    paths:
      - 'backend/**'
      - 'deploy/qa/**'
      - '.github/workflows/deploy-backend-qa.yml'
  workflow_dispatch:

# One rollout at a time; a newer push waits for a running one rather than cancelling it mid-deploy.
concurrency:
  group: deploy-backend-qa
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC token for azure/login
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Container Apps CLI extension
        run: az extension add --name containerapp --upgrade --yes

      - name: Build jar and image
        id: build
        run: deploy/qa/build-push-backend.sh "${GITHUB_SHA::12}"

      - name: Roll out to Container App
        run: deploy/qa/deploy-backend.sh "${{ steps.build.outputs.image }}"
