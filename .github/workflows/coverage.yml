name: Sanity and Coverage

on:
  push:
    branches:
      - qa
    paths:
      - "backend/**"
      - "frontend/**"
      - "qa/**"
      - ".github/workflows/coverage.yml"
      - ".github/workflows/*-coverage.yml"

  pull_request:
    branches:
      - qa
    paths:
      - "backend/**"
      - "frontend/**"
      - "qa/**"
      - ".github/workflows/coverage.yml"
      - ".github/workflows/*-coverage.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  sanity:
    name: Sanity Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: qa

    env:
      EMAIL: ${{ secrets.QA_EMAIL }}
      PASSWORD: ${{ secrets.QA_PASSWORD }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Start Frontend
        uses: ./.github/actions/start-frontend
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}
          api-url: ${{ vars.QA_API_URL }}

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: qa/pom.xml

      - name: Run Sanity Test
        run: mvn --batch-mode --no-transfer-progress -e clean test -Dtest=SanityTest -Dheadless=true

      - name: Show Frontend Log
        if: failure()
        run: cat "$RUNNER_TEMP/vite.log" || echo "No vite log found"

      - name: Upload Sanity Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-reports
          path: qa/target/surefire-reports/
          if-no-files-found: warn

  backend-coverage:
    needs: sanity
    uses: ./.github/workflows/backend-coverage.yml
    secrets: inherit

  frontend-coverage:
    needs: sanity
    uses: ./.github/workflows/frontend-coverage.yml
    secrets: inherit

  qa-coverage:
    needs: sanity
    uses: ./.github/workflows/qa-coverage.yml
    secrets: inherit