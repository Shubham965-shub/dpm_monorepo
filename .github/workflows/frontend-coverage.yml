name: Frontend Test Coverage

# Triggered only via coverage.yml, after the sanity job passes.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Frontend Tests and Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Frontend
        uses: ./.github/actions/setup-frontend
        with:
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Record start time
        id: timing
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The JSON reporter writes test-results.json so the dashboard can show test counts.
      - name: Run Frontend Tests and Coverage
        id: test
        run: npm run test:coverage -- --reporter=default --reporter=json --outputFile=test-results.json

      # Send this job's coverage to the feedback-service CI dashboard (feedback-admin → CI / Builds).
      # Runs even when tests fail, before the threshold gate, and never fails the job itself.
      - name: Report FRONTEND coverage to CI dashboard
        if: always()
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CI_API_BASE_URL: ${{ vars.CI_API_BASE_URL }}
          WORKFLOW_NAME: ${{ github.workflow }}
          BUILD_STATUS: ${{ steps.test.outcome == 'success' && 'SUCCESS' || 'FAILED' }}
          STARTED_AT: ${{ steps.timing.outputs.started_at }}
          COVERAGE_THRESHOLD: "80"
        run: bash ../.github/scripts/report-coverage.sh FRONTEND .

      - name: Display Coverage Summary
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');

          const report = 'coverage/coverage-summary.json';

          if (!fs.existsSync(report)) {
            console.error(`Coverage Summary not found: ${report}`);
            console.error(
              'Check whether the test command generates JSON coverage.'
            );
            process.exit(1);
          }

          const data = JSON.parse(
            fs.readFileSync(report, 'utf8')
          );
          const total = data.total;

          if (!total) {
            console.error(
              'The coverage report does not contain total metrics.'
            );
            process.exit(1);
          }

          const metrics = [
            'statements',
            'branches',
            'functions',
            'lines'
          ];

          let passed = true;

          

          for (const metric of metrics) {
            const value = total[metric]?.pct;
            if (typeof value !== 'number') {
              console.error(
                `${metric.padEnd(12)}: Missing coverage data`
              );
              passed = false;
              continue;
            }

            console.log(`${metric.padEnd(12)}: ${value.toFixed(2)}%`);
            if (value < 80) {
              passed = false;
            }
          }

          console.log('-------------------------');
          console.log(`Status: ${passed ? 'PASS' : 'FAIL'}`);

          if (!passed) {
            console.error('Coverage must be at least 80% for every metric.');
            process.exit(1);
          }

          console.log(
            'All coverage metrics meet the 80% threshold.'
          );
          NODE

      - name: Upload Frontend Coverage Report
        if: ${{ always()}}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 5