name: Setup Frontend
description: Install Node and the frontend's dependencies, including the private Strides package.

inputs:
  npm-token:
    description: Token with read:packages on the Strides org (GITHUB_TOKEN of another repo can't read it).
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
        registry-url: https://npm.pkg.github.com
        scope: "@strides-pharma-science-ltd"

    - name: Install dependencies
      shell: bash
      working-directory: frontend
      run: npm ci
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-token }}
