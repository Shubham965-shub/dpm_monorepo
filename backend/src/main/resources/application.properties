# Attempt to disable quarkus:dev's own /q/dev-ui console - currently a no-op on Quarkus 3.39.2
# (confirmed live: restarting with this set still serves /q/dev-ui in full; this version's
# quarkus-devui extension has no master enabled/disabled switch, only quarkus.dev-ui.cors.enabled
# and cosmetic settings - see its own quarkus-config-doc). Kept here anyway per explicit request,
# in case a future Quarkus upgrade adds real support for it.
quarkus.dev-ui.enabled=false

# Real dpm Postgres database (confirmed schema via direct read-only exploration).
# Credentials come from the environment only - see backend/README.md.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_JDBC_URL}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}

# Proposed starter sizing for a low-concurrency dashboard - confirm/adjust with the user
# before production use (see backend/CLAUDE.md: no unbounded pool, no silently-guessed sizing).
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.max-lifetime=30M

# Never auto-create/alter the schema - the users/user_roles/refresh_tokens tables are created
# manually (see backend/README.md for the exact contract). A mapping mismatch fails loudly at
# startup instead of silently drifting.
quarkus.hibernate-orm.schema-management.strategy=validate

# Required, no default - same "fail fast if missing" pattern as DB_JDBC_URL. A committed
# fallback secret (as some reference implementations use) is a real vulnerability if prod
# forgets to override it.
auth.jwt.secret=${JWT_SECRET}
auth.jwt.access-token-expire-minutes=15
auth.refresh-token-expire-days=7

# Separate secret so the feedback-widget token (sent to the external ARGUS Lighthouse feedback
# service, which verifies against its own shared "argus" secret) is independent from this app's own
# session token - rotating one never invalidates the other. See FeedbackJwtService.
auth.jwt.feedback-secret=${JWT_SECRET_FEEDBACK}

# CORS: explicit origin allowlist. No cookies/credentials are involved (bearer tokens only, sent
# via the Authorization header - see AuthController), so this doesn't carry the wildcard+credentials
# restriction a cookie-based flow would. Required, no default - a deploy that forgets this var
# should fail loudly at startup rather than silently fall back to the local dev origin.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS}
quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=authorization,content-type

# Optional one-time bootstrap: if set AND the users table is empty, creates one Admin-role user
# on startup (see AdminBootstrap). Unset in normal operation once an admin account exists.
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

# QC literal per department-scope pattern (see DepartmentScopeLiterals / backend/README.md's
# "Department scope" section) - confirmed live against the database, one per source vocabulary.
department-scope.qc-literal.resp-dept=Quality Control Department
department-scope.qc-literal.failure-category=Laboratory Control
department-scope.qc-literal.training-department=Quality Control

# kpi_threshold_snapshot is reloaded daily; limits whose computed_at is older than this still
# colour, but log a data-team alert (see KpiThresholdService). Value from the threshold guide.
kpi-thresholds.stale-after=P2D
# The default ("All"/"All") limits are held in memory and re-read this often (hourly, as agreed);
# filtered limits are always looked up per request.
kpi-thresholds.defaults-refresh-every=1h

# QC score colour bands (KPI Scoring Specification section 8): score >= green-min is green, >=
# amber-min amber, below that red. The spec flags these cut-offs as a business decision to confirm
# before release.
qc-score.band.green-min=85
qc-score.band.amber-min=60
