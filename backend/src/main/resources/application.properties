# Real dpm Postgres database (confirmed schema via direct read-only exploration).
# Credentials come from the environment only - see backend/README.md.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_JDBC_URL}
quarkus.datasource.username=${DB_USERNAME}
quarkus.datasource.password=${DB_PASSWORD}

# Proposed starter sizing for a low-concurrency dashboard - confirm/adjust with the user
# before production use (see backend/CLAUDE.md: no unbounded pool, no silently-guessed sizing).
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.max-lifetime=30M

# Never auto-create/alter the schema - the users/roles/permissions/refresh_tokens tables are
# created manually (see backend/README.md for the exact contract). A mapping mismatch fails
# loudly at startup instead of silently drifting.
quarkus.hibernate-orm.schema-management.strategy=validate

# Required, no default - same "fail fast if missing" pattern as DB_JDBC_URL. A committed
# fallback secret (as some reference implementations use) is a real vulnerability if prod
# forgets to override it.
auth.jwt.secret=${JWT_SECRET}
auth.jwt.access-token-expire-minutes=15
auth.refresh-token-expire-days=7

# CORS: explicit origin only - never a wildcard, since the refresh-token cookie flow requires
# allow-credentials=true, and wildcard-origin + credentials is unsafe (browsers reject it, but
# a permissive origin-reflection misconfiguration would defeat the point of scoping this at all).
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PATCH,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=authorization,content-type
quarkus.http.cors.access-control-allow-credentials=true

# The refresh-token cookie's Secure attribute requires HTTPS; disabled only for local http dev.
%dev.auth.cookie.secure=false
%test.auth.cookie.secure=false
auth.cookie.secure=true

# Optional one-time bootstrap: if set AND the users table is empty, creates one Admin-role user
# on startup (see AdminBootstrap). Unset in normal operation once an admin account exists.
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
