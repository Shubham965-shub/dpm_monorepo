# baseUrl is the frontend dev server; apiBaseUrl must match whatever that frontend's own
# VITE_API_URL points to (frontend/.env, gitignored) - NOT necessarily localhost:8080. This repo's
# frontend/.env currently points at the deployed qa backend, so that's the default here too -
# override with -DapiBaseUrl=... if your local frontend/.env points somewhere else (e.g.
# http://localhost:8080, matching frontend/.env.example).
baseUrl=http://localhost:5174
apiBaseUrl=https://dpm-backend-qa.lemonbeach-6cc221e9.centralindia.azurecontainerapps.io
browser=chrome

